# Fly.io deployment manifest (set app name before running `fly launch` or `fly deploy`)
app = "heart-disease-risk-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  MODEL_PATH = "/code/models/model_pipeline.bin"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 9696
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
