[project]
name = "heart-disease-risk-prediction"
version = "0.1.0"
description = "End-to-end clinical heart disease risk prediction system for ML Zoomcamp 2026 Midterm Project."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "pydantic>=2.9.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.14.1",
    "uvicorn>=0.32.0",
    "xgboost>=2.1.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.9.2",
    "nbconvert>=7.16.4",
    "nbformat>=5.10.4",
    "pytest>=8.3.3",
    "requests>=2.32.3",
    "seaborn>=0.13.2",
]
